<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Sign Up — UpsellX</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css"/>
</head>

<body>

    <div class="split-auth">

        <div class="split-left">

            <a class="split-logo" href="index.html">

                <div class="nav-ico">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="white"
                        stroke-width="2.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M23 6l-9.5 9.5-5-5L1 18"/>
                        <path d="M17 6h6v6"/>
                    </svg>
                </div>

                <span>UpsellX</span>

            </a>


            <div class="illus-wrap">

                <div class="illus-blob b1"></div>
                <div class="illus-blob b2"></div>


                <div class="illus-float f1">

                    <div class="ic">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="#1f6644"
                            stroke-width="2.3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                    </div>

                    <div>
                        <div class="lbl">New Workspace</div>
                        <div class="val">Ready</div>
                    </div>

                </div>


                <div class="illus-float f2">

                    <div class="ic">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="#5b43d6"
                            stroke-width="2.3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M12 2v20M2 12h20"/>
                        </svg>
                    </div>

                    <div>
                        <div class="lbl">Setup Time</div>
                        <div class="val">2 min</div>
                    </div>

                </div>


                <div class="illus-phone">

                    <div class="illus-notch"></div>


                    <div class="illus-chart-row">

                        <div
                            class="illus-chart-bar"
                            style="height:30%"
                        ></div>

                        <div
                            class="illus-chart-bar"
                            style="height:48%"
                        ></div>

                        <div
                            class="illus-chart-bar"
                            style="height:38%"
                        ></div>

                        <div
                            class="illus-chart-bar"
                            style="height:70%"
                        ></div>

                        <div
                            class="illus-chart-bar"
                            style="height:58%"
                        ></div>

                        <div
                            class="illus-chart-bar"
                            style="height:88%"
                        ></div>

                    </div>


                    <div class="illus-mini-card">

                        <div class="ic">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#5b43d6"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>

                        <div class="txt">
                            <div class="l1"></div>
                            <div class="l2"></div>
                        </div>

                    </div>


                    <div class="illus-mini-card green">

                        <div class="ic">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#1f6644"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                        </div>

                        <div class="txt">
                            <div class="l1"></div>
                            <div class="l2"></div>
                        </div>

                    </div>


                    <div class="illus-mini-card">

                        <div class="ic">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#5b43d6"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect x="3" y="3" width="7" height="7" rx="1"/>
                                <rect x="14" y="3" width="7" height="7" rx="1"/>
                                <rect x="14" y="14" width="7" height="7" rx="1"/>
                                <rect x="3" y="14" width="7" height="7" rx="1"/>
                            </svg>
                        </div>

                        <div class="txt">
                            <div class="l1"></div>
                            <div class="l2"></div>
                        </div>

                    </div>

                </div>

            </div>

        </div>


        <div class="split-right">

            <div class="split-right-inner wide">

                <h1>Create Account!</h1>

                <p class="split-sub">
                    Already have an account?

                    <button
                        type="button"
                        onclick="location.href='login.html'"
                    >
                        Log In
                    </button>
                </p>


                <div class="form-row-dark">

                    <div class="fg-dark">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="suName"
                            placeholder="Your full name"
                            maxlength="50"
                            autocomplete="name"
                        />

                        <div
                            class="field-error-dark"
                            id="suNameError"
                        ></div>

                    </div>


                    <div class="fg-dark">

                        <label>Email</label>

                        <input
                            type="email"
                            id="suEmail"
                            placeholder="you@company.com"
                            autocomplete="email"
                        />

                        <div
                            class="field-error-dark"
                            id="suEmailError"
                        ></div>

                    </div>

                </div>


                <div class="fg-dark">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="suPhone"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                    />

                    <div
                        class="field-error-dark"
                        id="suPhoneError"
                    ></div>

                </div>


                <div class="form-row-dark">

                    <div class="fg-dark">

                        <label>Password</label>

                        <input
                            type="password"
                            id="suPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                        />

                        <div
                            class="field-error-dark"
                            id="suPasswordError"
                        ></div>

                    </div>
                    <div class="fg-dark">

                        <label>Confirm Password</label>

                        <input
                            type="password"
                            id="suConfirm"
                            placeholder="Re-enter password"
                            autocomplete="new-password"
                        />

                        <div
                            class="field-error-dark"
                            id="suConfirmError"
                        ></div>

                    </div>

                </div>


                <div class="terms-row-dark">

                    <input
                        type="checkbox"
                        id="suTerms"
                    />

                    <span>
                        I agree to UpsellX's Terms of Service and Privacy Policy,
                        and consent to my data being processed as described.
                    </span>

                </div>


                <div
                    class="field-error-dark"
                    id="suTermsError"
                ></div>


                <button
                    class="btn-light-block"
                    type="button"
                    onclick="handleSignup()"
                >
                    Create Account
                </button>

            </div>

        </div>

    </div>


    <script src="js/signup.js"></script>

</body>
</html>
