<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log In — UpsellX</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="split-auth">

<div class="split-left">
<a class="split-logo" href="index.html">
<div class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg></div>
<span>UpsellX</span>
</a>

<div class="illus-wrap">
<div class="illus-blob b1"></div>
<div class="illus-blob b2"></div>

<div class="illus-float f1">
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1f6644" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg></div>
<div><div class="lbl">Upsell Score</div><div class="val">92%</div></div>
</div>

<div class="illus-float f2">
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#5b43d6" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
<div><div class="lbl">Segments</div><div class="val">Ready</div></div>
</div>

<div class="illus-phone">
<div class="illus-notch"></div>
<div class="illus-chart-row">
<div class="illus-chart-bar" style="height:35%"></div>
<div class="illus-chart-bar" style="height:55%"></div>
<div class="illus-chart-bar" style="height:40%"></div>
<div class="illus-chart-bar" style="height:75%"></div>
<div class="illus-chart-bar" style="height:60%"></div>
<div class="illus-chart-bar" style="height:90%"></div>
</div>
<div class="illus-mini-card">
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#5b43d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></div>
<div class="txt"><div class="l1"></div><div class="l2"></div></div>
</div>
<div class="illus-mini-card green">
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1f6644" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
<div class="txt"><div class="l1"></div><div class="l2"></div></div>
</div>
<div class="illus-mini-card">
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#5b43d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
<div class="txt"><div class="l1"></div><div class="l2"></div></div>
</div>
</div>
</div>
</div>

<div class="split-right">
<div class="split-right-inner">
<h1>Welcome Back!</h1>
<p class="split-sub">Don't have an account yet? <button type="button" onclick="location.href='signup.html'">Sign Up</button></p>

<div class="fg-dark">
<label>Email Address</label>
<input type="email" id="loginEmail" placeholder="you@company.com"/>
</div>
<div class="fg-dark">
<label>Password</label>
<input type="password" id="loginPassword" placeholder="••••••••"/>
</div>
<div class="field-error-dark" id="loginError"></div>

<div class="row-between-dark">
<label class="remember-dark"><input type="checkbox"/> Keep me logged in</label>
<button type="button" class="link-dark" onclick="alert('Password reset isn\'t wired up in this demo yet.')">Forgot Password?</button>
</div>

<button class="btn-light-block" type="button" onclick="handleLogin()">Login</button>
</div>
</div>

</div>

<script src="js/login.js"></script>
</body>
</html>
